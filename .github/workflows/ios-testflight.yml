name: Upload iOS beta to TestFlight

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: What testers should test in this build
        required: false
        default: Personal TestFlight build
        type: string

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Validate required secrets
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_P8 \
            IOS_TEAM_ID \
            MATCH_GIT_URL \
            MATCH_PASSWORD \
            MATCH_GIT_BASIC_AUTHORIZATION
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Write App Store Connect API key
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          grep -q -- "-----BEGIN PRIVATE KEY-----" "$key_path"
          grep -q -- "-----END PRIVATE KEY-----" "$key_path"
          echo "APP_STORE_CONNECT_API_KEY_KEY_FILEPATH=$key_path" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci
        working-directory: frontend

      - name: Build and sync the Capacitor iOS app
        run: npm run build:mobile
        working-directory: frontend

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: frontend/ios

      - name: Install CocoaPods
        run: bundle exec pod install
        working-directory: frontend/ios/App

      - name: Build and upload TestFlight beta
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          IOS_BUILD_NUMBER: ${{ github.run_number }}
          TESTFLIGHT_WHAT_TO_TEST: ${{ inputs.release_notes }}
        run: bundle exec fastlane ios beta
        working-directory: frontend/ios

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openGym-ios-ipa
          path: frontend/build/ios/ipa/*.ipa
          if-no-files-found: ignore

      - name: Upload Fastlane build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-gym-logs
          path: ~/Library/Logs/gym/*.log
          if-no-files-found: ignore

      - name: Cleanup App Store Connect API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
